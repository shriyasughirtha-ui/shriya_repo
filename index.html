<!DOCTYPE html>
<html>
<head>
<title>Do You Love Me? ❤️</title>
<style>
body{
    text-align:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family:Arial;
    color:white;
    margin-top:150px;
}

h1{
    font-size:40px;
}

button{
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:30px;
    margin:20px;
    cursor:pointer;
    transition:0.3s;
}

#yes{
    background:red;
    color:white;
}

#no{
    background:white;
    color:red;
}
</style>
</head>

<body>

<h1>Do You Love Me? 💕</h1>

<button id="yes" onclick="goNext()">Yes ❤️</button>
<button id="no" onclick="growYes()">No 💔</button>

<script>

function growYes(){
    let yesBtn=document.getElementById("yes");
    yesBtn.style.fontSize="40px";
    yesBtn.style.padding="25px 50px";
}

function goNext(){
    window.location.href="questions.html";
}

</script>

</body>
</html>
